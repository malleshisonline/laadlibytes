<head>
  <meta charset="UTF-8" />

  <title>Laadli Bytes | Traditional Chikkis from Vrindavan</title>

    content="Traditional chikkis and Chhappan Bhog offerings from Vrindavan, made with pure ingredients and love. Shop Laadli Bytes online." />

  <link rel="apple-touch-icon" href="/favicon.png?v=2" />

  <!-- Link preview on WhatsApp, Facebook, LinkedIn.
         Place social-share-image.jpg (1200 x 630) in frontend/public/.
         Replace https://laadlibytes.com with the live domain before launch. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Laadli Bytes" />
  <meta property="og:title" content="Laadli Bytes | Traditional Chikkis from Vrindavan" />
  <meta property="og:description"
    content="Traditional chikkis and Chhappan Bhog offerings from Vrindavan, made with pure ingredients and love." />
  <meta property="og:image" content="https://laadlibytes.com/social-share-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
